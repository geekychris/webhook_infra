services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventgateway
      POSTGRES_USER: egw
      POSTGRES_PASSWORD: egw
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egw -d eventgateway"]
      interval: 2s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:19092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 15s

  valkey:
    image: valkey/valkey:8-alpine
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  subscriber-registry:
    build:
      context: ../..
      dockerfile: services/subscriber-registry/Dockerfile
    environment:
      DATABASE_URL: "postgres://egw:egw@postgres:5432/eventgateway?sslmode=disable"
      HTTP_PORT: "8081"
      KAFKA_BROKERS: "kafka:19092"
    ports:
      - "18081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  config-distributor:
    build:
      context: ../..
      dockerfile: services/config-distributor/Dockerfile
    environment:
      DATABASE_URL: "postgres://egw:egw@postgres:5432/eventgateway?sslmode=disable"
      GRPC_PORT: "50051"
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-router:
    build:
      context: ../..
      dockerfile: services/ingestion-router/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:19092"
      CONFIG_DISTRIBUTOR_ADDR: "config-distributor:50051"
      REDIS_ADDR: "valkey:6379"
      REGISTRY_URL: "http://subscriber-registry:8081"
      CACHE_SYNC_INTERVAL: "5m"
    depends_on:
      kafka:
        condition: service_healthy
      config-distributor:
        condition: service_started
      valkey:
        condition: service_healthy
      subscriber-registry:
        condition: service_started

  subscriber-queue-service:
    build:
      context: ../..
      dockerfile: services/subscriber-queue-service/Dockerfile
    environment:
      GRPC_PORT: "50052"
      DATA_DIR: "/data/queue"
      STORE_BACKEND: "rocksdb"
      QUEUE_TTL: "720h"  # 30 days
    volumes:
      - queuedata:/data/queue

  queue-writer:
    build:
      context: ../..
      dockerfile: services/queue-writer/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:19092"
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
      REDIS_ADDR: "valkey:6379"
    depends_on:
      kafka:
        condition: service_healthy
      subscriber-queue-service:
        condition: service_started
      valkey:
        condition: service_healthy

  webhook-dispatcher:
    build:
      context: ../..
      dockerfile: services/webhook-dispatcher/Dockerfile
    environment:
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
      REGISTRY_URL: "http://subscriber-registry:8081"
      REDIS_ADDR: "valkey:6379"
      HEALTH_PORT: "8082"
    depends_on:
      subscriber-queue-service:
        condition: service_started
      subscriber-registry:
        condition: service_started
      valkey:
        condition: service_healthy

  stream-gateway:
    build:
      context: ../..
      dockerfile: services/stream-gateway/Dockerfile
    environment:
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
      REGISTRY_URL: "http://subscriber-registry:8081"
      REDIS_ADDR: "valkey:6379"
      HTTP_PORT: "8090"
    ports:
      - "18090:8090"
    depends_on:
      subscriber-queue-service:
        condition: service_started
      valkey:
        condition: service_healthy

  admin-api:
    build:
      context: ../..
      dockerfile: services/admin-api/Dockerfile
    environment:
      DATABASE_URL: "postgres://egw:egw@postgres:5432/eventgateway?sslmode=disable"
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
      REGISTRY_URL: "http://subscriber-registry:8081"
      HTTP_PORT: "8085"
    ports:
      - "18085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      subscriber-queue-service:
        condition: service_started
      subscriber-registry:
        condition: service_started

  # Dev/test UI tools (use --profile tools to start)
  producer-ui:
    build:
      context: ../..
      dockerfile: tools/producer-ui/Dockerfile
    environment:
      HTTP_PORT: "8070"
      KAFKA_BROKERS: "kafka:19092"
      REGISTRY_URL: "http://subscriber-registry:8081"
      ADMIN_URL: "http://admin-api:8085"
    ports:
      - "18070:8070"
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - tools

  consumer-ui:
    build:
      context: ../..
      dockerfile: tools/consumer-ui/Dockerfile
    environment:
      HTTP_PORT: "8071"
      SIGNING_KEY: "test-signing-key"
      REGISTRY_URL: "http://subscriber-registry:8081"
      ADMIN_URL: "http://admin-api:8085"
      STREAM_GATEWAY_URL: "ws://stream-gateway:8090"
    ports:
      - "18071:8071"
    depends_on:
      subscriber-registry:
        condition: service_started
      stream-gateway:
        condition: service_started
    profiles:
      - tools

  # Synthetic test services (use --profile synthetic to start)
  event-generator:
    build:
      context: ../..
      dockerfile: synthetic/event-generator/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:19092"
      EVENTS_PER_SECOND: "10"
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - synthetic

  webhook-subscriber:
    build:
      context: ../..
      dockerfile: synthetic/webhook-subscriber/Dockerfile
    environment:
      HTTP_PORT: "9090"
      FAILURE_RATE: "0.0"
      SIGNING_KEY: "test-signing-key"
    ports:
      - "19090:9090"
    profiles:
      - synthetic

  stream-subscriber:
    build:
      context: ../..
      dockerfile: synthetic/stream-subscriber/Dockerfile
    environment:
      GATEWAY_URL: "ws://stream-gateway:8090/v1/stream"
      SUBSCRIPTION_ID: "test-sub-1"
      AUTH_TOKEN: "test-token"
    depends_on:
      stream-gateway:
        condition: service_started
    profiles:
      - synthetic

volumes:
  pgdata:
  queuedata:
