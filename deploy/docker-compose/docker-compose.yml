services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: eventgateway
      POSTGRES_USER: egw
      POSTGRES_PASSWORD: egw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egw -d eventgateway"]
      interval: 2s
      timeout: 5s
      retries: 10

  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  subscriber-registry:
    build:
      context: ../..
      dockerfile: services/subscriber-registry/Dockerfile
    environment:
      DATABASE_URL: "postgres://egw:egw@postgres:5432/eventgateway?sslmode=disable"
      HTTP_PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  config-distributor:
    build:
      context: ../..
      dockerfile: services/config-distributor/Dockerfile
    environment:
      DATABASE_URL: "postgres://egw:egw@postgres:5432/eventgateway?sslmode=disable"
      GRPC_PORT: "50051"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  ingestion-router:
    build:
      context: ../..
      dockerfile: services/ingestion-router/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
      CONFIG_DISTRIBUTOR_ADDR: "config-distributor:50051"
    depends_on:
      kafka:
        condition: service_healthy
      config-distributor:
        condition: service_started

  subscriber-queue-service:
    build:
      context: ../..
      dockerfile: services/subscriber-queue-service/Dockerfile
    environment:
      GRPC_PORT: "50052"
    ports:
      - "50052:50052"

  queue-writer:
    build:
      context: ../..
      dockerfile: services/queue-writer/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
    depends_on:
      kafka:
        condition: service_healthy
      subscriber-queue-service:
        condition: service_started

  webhook-dispatcher:
    build:
      context: ../..
      dockerfile: services/webhook-dispatcher/Dockerfile
    environment:
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
      REGISTRY_URL: "http://subscriber-registry:8081"
      HEALTH_PORT: "8082"
    depends_on:
      subscriber-queue-service:
        condition: service_started
      subscriber-registry:
        condition: service_started

  stream-gateway:
    build:
      context: ../..
      dockerfile: services/stream-gateway/Dockerfile
    environment:
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
      REGISTRY_URL: "http://subscriber-registry:8081"
      HTTP_PORT: "8090"
    ports:
      - "8090:8090"
    depends_on:
      subscriber-queue-service:
        condition: service_started

  admin-api:
    build:
      context: ../..
      dockerfile: services/admin-api/Dockerfile
    environment:
      DATABASE_URL: "postgres://egw:egw@postgres:5432/eventgateway?sslmode=disable"
      QUEUE_SERVICE_ADDR: "subscriber-queue-service:50052"
      HTTP_PORT: "8085"
    ports:
      - "8085:8085"
    depends_on:
      postgres:
        condition: service_healthy
      subscriber-queue-service:
        condition: service_started

  # Synthetic test services (use --profile synthetic to start)
  event-generator:
    build:
      context: ../..
      dockerfile: synthetic/event-generator/Dockerfile
    environment:
      KAFKA_BROKERS: "kafka:9092"
      EVENTS_PER_SECOND: "10"
    depends_on:
      kafka:
        condition: service_healthy
    profiles:
      - synthetic

  webhook-subscriber:
    build:
      context: ../..
      dockerfile: synthetic/webhook-subscriber/Dockerfile
    environment:
      HTTP_PORT: "9090"
      FAILURE_RATE: "0.0"
      SIGNING_KEY: "test-signing-key"
    ports:
      - "9090:9090"
    profiles:
      - synthetic

  stream-subscriber:
    build:
      context: ../..
      dockerfile: synthetic/stream-subscriber/Dockerfile
    environment:
      GATEWAY_URL: "ws://stream-gateway:8090/v1/stream"
      SUBSCRIPTION_ID: "test-sub-1"
      AUTH_TOKEN: "test-token"
    depends_on:
      stream-gateway:
        condition: service_started
    profiles:
      - synthetic

volumes:
  pgdata:
