apiVersion: v1
kind: Service
metadata:
  name: admin-api
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/part-of: event-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8085
      targetPort: 8085
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: admin-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-api
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: admin-api
    app.kubernetes.io/part-of: event-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-api
        app.kubernetes.io/part-of: event-gateway
    spec:
      containers:
        - name: admin-api
          image: event-gateway/admin-api:latest
          ports:
            - containerPort: 8085
              name: http
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: event-gateway-secrets
                  key: DATABASE_URL
            - name: QUEUE_SERVICE_ADDR
              value: "subscriber-queue-service.event-gateway.svc.cluster.local:50052"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8085
            initialDelaySeconds: 10
            periodSeconds: 10
