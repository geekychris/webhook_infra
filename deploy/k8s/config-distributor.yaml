apiVersion: v1
kind: Service
metadata:
  name: config-distributor
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: config-distributor
    app.kubernetes.io/part-of: event-gateway
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      protocol: TCP
      name: grpc
  selector:
    app.kubernetes.io/name: config-distributor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-distributor
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: config-distributor
    app.kubernetes.io/part-of: event-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: config-distributor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: config-distributor
        app.kubernetes.io/part-of: event-gateway
    spec:
      containers:
        - name: config-distributor
          image: event-gateway/config-distributor:latest
          ports:
            - containerPort: 50051
              name: grpc
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: event-gateway-secrets
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
