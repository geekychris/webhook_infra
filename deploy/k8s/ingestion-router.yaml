apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingestion-router
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: ingestion-router
    app.kubernetes.io/part-of: event-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ingestion-router
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingestion-router
        app.kubernetes.io/part-of: event-gateway
    spec:
      containers:
        - name: ingestion-router
          image: event-gateway/ingestion-router:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: KAFKA_BROKERS
              value: "kafka.event-gateway.svc.cluster.local:9092"
            - name: CONFIG_DISTRIBUTOR_ADDR
              value: "config-distributor.event-gateway.svc.cluster.local:50051"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingestion-router-hpa
  namespace: event-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingestion-router
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
