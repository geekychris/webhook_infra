apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: event-gateway
data:
  init.sql: |
    -- initialization scripts run on first boot
    SELECT 'event-gateway database ready';
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: event-gateway
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
      name: postgres
  selector:
    app.kubernetes.io/name: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: event-gateway
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: event-gateway
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: eventgateway
            - name: POSTGRES_USER
              value: egw
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: event-gateway-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - egw
                - -d
                - eventgateway
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - egw
                - -d
                - eventgateway
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
