apiVersion: apps/v1
kind: Deployment
metadata:
  name: queue-writer
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: queue-writer
    app.kubernetes.io/part-of: event-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: queue-writer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: queue-writer
        app.kubernetes.io/part-of: event-gateway
    spec:
      containers:
        - name: queue-writer
          image: event-gateway/queue-writer:latest
          env:
            - name: KAFKA_BROKERS
              value: "kafka.event-gateway.svc.cluster.local:9092"
            - name: QUEUE_SERVICE_ADDR
              value: "subscriber-queue-service.event-gateway.svc.cluster.local:50052"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: queue-writer-hpa
  namespace: event-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: queue-writer
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
