apiVersion: v1
kind: Service
metadata:
  name: stream-gateway
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: stream-gateway
    app.kubernetes.io/part-of: event-gateway
spec:
  type: ClusterIP
  ports:
    - port: 8090
      targetPort: 8090
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: stream-gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-gateway
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: stream-gateway
    app.kubernetes.io/part-of: event-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stream-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-gateway
        app.kubernetes.io/part-of: event-gateway
    spec:
      containers:
        - name: stream-gateway
          image: event-gateway/stream-gateway:latest
          ports:
            - containerPort: 8090
              name: http
          env:
            - name: QUEUE_SERVICE_ADDR
              value: "subscriber-queue-service.event-gateway.svc.cluster.local:50052"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
