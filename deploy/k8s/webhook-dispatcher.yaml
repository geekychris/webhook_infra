apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-dispatcher
  namespace: event-gateway
  labels:
    app.kubernetes.io/name: webhook-dispatcher
    app.kubernetes.io/part-of: event-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: webhook-dispatcher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webhook-dispatcher
        app.kubernetes.io/part-of: event-gateway
    spec:
      containers:
        - name: webhook-dispatcher
          image: event-gateway/webhook-dispatcher:latest
          env:
            - name: QUEUE_SERVICE_ADDR
              value: "subscriber-queue-service.event-gateway.svc.cluster.local:50052"
            - name: REGISTRY_URL
              value: "http://subscriber-registry.event-gateway.svc.cluster.local:8081"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: webhook-dispatcher-hpa
  namespace: event-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: webhook-dispatcher
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
