<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Conduit — Test Consumer</title>
<style>
  :root {
    --bg-primary: #0f1923;
    --bg-secondary: #1a2736;
    --bg-card: #1e2f40;
    --bg-input: #162230;
    --border: #2a3f55;
    --text-primary: #e8edf2;
    --text-secondary: #8899aa;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --green: #22c55e;
    --red: #ef4444;
    --orange: #f59e0b;
    --yellow: #eab308;
    --purple: #a855f7;
    --cyan: #06b6d4;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Top Bar */
  .topbar {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-shrink: 0;
  }

  .topbar-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--accent);
    white-space: nowrap;
  }

  .topbar-title span {
    color: var(--text-secondary);
    font-weight: 400;
  }

  .stats-group {
    display: flex;
    gap: 12px;
    margin-left: auto;
    align-items: center;
  }

  .stat-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--text-secondary);
  }

  .stat-badge .stat-value {
    font-weight: 700;
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  .stat-badge .stat-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg-card);
    color: var(--text-primary);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .btn:hover { background: var(--bg-secondary); border-color: var(--text-secondary); }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }

  .btn-primary:hover { background: var(--accent-hover); }

  .btn-danger {
    border-color: var(--red);
    color: var(--red);
  }

  .btn-danger:hover { background: rgba(239, 68, 68, 0.1); }

  .btn-green {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }

  .btn-green:hover { background: #16a34a; }

  /* Split panels */
  .panels {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 0;
  }

  .panel {
    display: flex;
    flex-direction: column;
    min-height: 0;
    border-right: 1px solid var(--border);
  }

  .panel:last-child { border-right: none; }

  .panel-header {
    background: var(--bg-secondary);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    flex-shrink: 0;
  }

  .panel-header-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .panel-title {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: background 0.3s;
  }

  .status-dot.active { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.waiting { background: var(--text-secondary); }
  .status-dot.connecting { background: var(--yellow); box-shadow: 0 0 6px var(--yellow); animation: pulse 1s infinite; }
  .status-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  .webhook-url-bar {
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .webhook-url {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    font-size: 12px;
    color: var(--green);
    user-select: all;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .stream-controls {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .stream-controls-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .stream-controls select,
  .stream-controls input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-primary);
    outline: none;
  }

  .stream-controls select:focus,
  .stream-controls input:focus {
    border-color: var(--accent);
  }

  .stream-controls select option {
    background: var(--bg-secondary);
    color: var(--text-primary);
  }

  .filter-bar {
    margin-top: 8px;
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .filter-bar input {
    flex: 1;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 12px;
    color: var(--text-primary);
    outline: none;
  }

  .filter-bar input:focus { border-color: var(--accent); }
  .filter-bar input::placeholder { color: var(--text-secondary); }

  /* Event log */
  .event-log {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .event-log::-webkit-scrollbar { width: 6px; }
  .event-log::-webkit-scrollbar-track { background: transparent; }
  .event-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .event-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    cursor: pointer;
    transition: border-color 0.15s;
    animation: slideIn 0.2s ease-out;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .event-card:hover { border-color: var(--text-secondary); }

  .event-card-header {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .channel-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .channel-badge.webhook {
    background: rgba(59, 130, 246, 0.15);
    color: var(--accent);
    border: 1px solid rgba(59, 130, 246, 0.3);
  }

  .channel-badge.stream {
    background: rgba(34, 197, 94, 0.15);
    color: var(--green);
    border: 1px solid rgba(34, 197, 94, 0.3);
  }

  .event-type {
    font-weight: 600;
    font-size: 13px;
  }

  .hmac-badge {
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 3px;
    margin-left: auto;
  }

  .hmac-badge.valid { background: rgba(34,197,94,0.15); color: var(--green); }
  .hmac-badge.invalid { background: rgba(239,68,68,0.15); color: var(--red); }
  .hmac-badge.none { background: rgba(136,153,170,0.1); color: var(--text-secondary); }

  .queue-pos {
    font-size: 10px;
    color: var(--text-secondary);
    font-family: 'SF Mono', Monaco, monospace;
    margin-left: auto;
  }

  .event-card-meta {
    display: flex;
    gap: 16px;
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }

  .event-card-meta span { white-space: nowrap; }

  .event-delivery-info {
    margin-top: 6px;
    padding: 6px 8px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    font-size: 10px;
    line-height: 1.6;
    color: var(--text-secondary);
    display: none;
  }
  .event-card.expanded .event-delivery-info { display: block; }

  .event-json {
    margin-top: 8px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
    font-size: 11px;
    line-height: 1.5;
    overflow-x: auto;
    max-height: 300px;
    overflow-y: auto;
    display: none;
    white-space: pre-wrap;
    word-break: break-all;
  }

  .event-card.expanded .event-json { display: block; }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    color: var(--text-secondary);
    font-size: 13px;
    gap: 8px;
    padding: 40px;
    text-align: center;
  }

  .empty-state-icon { font-size: 32px; opacity: 0.3; }

  .pause-btn {
    font-size: 11px;
    padding: 2px 8px;
    margin-left: auto;
  }

  .status-text {
    font-size: 11px;
    color: var(--text-secondary);
    margin-left: auto;
  }

  .status-text.connected { color: var(--green); }
  .status-text.connecting { color: var(--yellow); }
  .status-text.error { color: var(--red); }

  /* JSON syntax highlighting */
  .json-key { color: #7dd3fc; }
  .json-string { color: #86efac; }
  .json-number { color: #fbbf24; }
  .json-bool { color: #c084fc; }
  .json-null { color: var(--text-secondary); }

  /* Event type colors */
  .etype-invoice { color: #3b82f6; }
  .etype-payment { color: #22c55e; }
  .etype-order { color: #f59e0b; }
  .etype-customer { color: #a855f7; }
  .etype-shipment { color: #06b6d4; }
  .etype-subscription { color: #ec4899; }
  .etype-default { color: var(--text-primary); }

  .copy-toast {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: var(--green);
    color: #fff;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 12px;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.2s;
    pointer-events: none;
    z-index: 100;
  }

  .copy-toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<!-- Top Bar -->
<div class="topbar">
  <div class="topbar-title">Event Conduit <span>/ Test Consumer</span></div>
  <div class="stats-group">
    <div class="stat-badge">
      <div class="stat-dot" style="background: var(--accent)"></div>
      Webhook <span class="stat-value" id="stat-webhook">0</span>
    </div>
    <div class="stat-badge">
      <div class="stat-dot" style="background: var(--green)"></div>
      Stream <span class="stat-value" id="stat-stream">0</span>
    </div>
    <div class="stat-badge">
      <div class="stat-dot" style="background: var(--orange)"></div>
      Active Streams <span class="stat-value" id="stat-active">0</span>
    </div>
    <button class="btn btn-danger" onclick="clearAll()">Clear All</button>
  </div>
</div>

<!-- Split Panels -->
<div class="panels">

  <!-- Left: Webhook Consumer -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-header-row">
        <div class="panel-title">
          <div class="status-dot" id="webhook-dot"></div>
          Webhook Receiver
        </div>
        <span class="status-text" id="webhook-status">Waiting for events...</span>
        <button class="btn pause-btn" id="webhook-pause-btn" onclick="togglePause('webhook')">Auto-scroll ON</button>
      </div>
      <div class="webhook-url-bar">
        <div class="webhook-url" id="webhook-url"></div>
        <button class="btn" onclick="copyWebhookURL()">Copy</button>
      </div>
      <div class="filter-bar">
        <input type="text" id="webhook-filter" placeholder="Filter by event type..." oninput="renderWebhookEvents()">
      </div>
    </div>
    <div class="event-log" id="webhook-log"></div>
  </div>

  <!-- Right: Stream Consumer -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-header-row">
        <div class="panel-title">
          <div class="status-dot waiting" id="stream-dot"></div>
          Stream Consumer
        </div>
        <span class="status-text" id="stream-status">Disconnected</span>
        <button class="btn pause-btn" id="stream-pause-btn" onclick="togglePause('stream')">Auto-scroll ON</button>
      </div>
      <div class="stream-controls">
        <div class="stream-controls-row">
          <select id="stream-sub-select">
            <option value="">-- Select a subscription --</option>
          </select>
          <button class="btn" onclick="loadSubscriptions()">Refresh</button>
        </div>
        <div class="stream-controls-row">
          <input type="text" id="stream-resume" placeholder="Resume after position (optional)">
          <button class="btn btn-green" id="stream-connect-btn" onclick="toggleStreamConnection()">Connect</button>
        </div>
      </div>
      <div class="filter-bar">
        <input type="text" id="stream-filter" placeholder="Filter by event type..." oninput="renderStreamEvents()">
      </div>
    </div>
    <div class="event-log" id="stream-log"></div>
  </div>

</div>

<div class="copy-toast" id="copy-toast">Copied to clipboard</div>

<script>
// -----------------------------------------------------------------------
// State
// -----------------------------------------------------------------------
let webhookEvents = [];
let streamEvents = [];
let webhookPaused = false;
let streamPaused = false;
let streamConnected = false;
let streamSubID = '';
let browserWS = null;
let lastWebhookCount = 0;

const webhookLog = document.getElementById('webhook-log');
const streamLog = document.getElementById('stream-log');

// Set the webhook URL display.
const host = location.hostname || 'localhost';
const port = location.port || '8071';
document.getElementById('webhook-url').textContent = `http://${host}:${port}/webhook`;

// -----------------------------------------------------------------------
// Event type color mapping
// -----------------------------------------------------------------------
const typeColors = {};
const colorPalette = [
  '#3b82f6', '#22c55e', '#f59e0b', '#a855f7', '#06b6d4',
  '#ec4899', '#ef4444', '#84cc16', '#f97316', '#6366f1',
  '#14b8a6', '#e879f9', '#fb923c', '#4ade80', '#38bdf8'
];
let colorIdx = 0;

function getTypeColor(eventType) {
  if (!typeColors[eventType]) {
    typeColors[eventType] = colorPalette[colorIdx % colorPalette.length];
    colorIdx++;
  }
  return typeColors[eventType];
}

// -----------------------------------------------------------------------
// JSON syntax highlighter
// -----------------------------------------------------------------------
function highlightJSON(obj, indent) {
  indent = indent || 0;
  const pad = '  '.repeat(indent);
  if (obj === null) return '<span class="json-null">null</span>';
  if (typeof obj === 'boolean') return `<span class="json-bool">${obj}</span>`;
  if (typeof obj === 'number') return `<span class="json-number">${obj}</span>`;
  if (typeof obj === 'string') {
    const escaped = obj.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    return `<span class="json-string">"${escaped}"</span>`;
  }
  if (Array.isArray(obj)) {
    if (obj.length === 0) return '[]';
    const items = obj.map(v => pad + '  ' + highlightJSON(v, indent + 1));
    return '[\n' + items.join(',\n') + '\n' + pad + ']';
  }
  if (typeof obj === 'object') {
    const keys = Object.keys(obj);
    if (keys.length === 0) return '{}';
    const entries = keys.map(k => {
      const escaped = k.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return pad + '  ' + `<span class="json-key">"${escaped}"</span>: ` + highlightJSON(obj[k], indent + 1);
    });
    return '{\n' + entries.join(',\n') + '\n' + pad + '}';
  }
  return String(obj);
}

// -----------------------------------------------------------------------
// Relative time
// -----------------------------------------------------------------------
function relativeTime(isoStr) {
  const now = Date.now();
  const t = new Date(isoStr).getTime();
  const diff = Math.max(0, Math.floor((now - t) / 1000));
  if (diff < 5) return 'just now';
  if (diff < 60) return diff + 's ago';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  return Math.floor(diff / 86400) + 'd ago';
}

// -----------------------------------------------------------------------
// Render an event card
// -----------------------------------------------------------------------
function renderEventCard(ev) {
  let ce = {};
  try { ce = typeof ev.event === 'string' ? JSON.parse(ev.event) : ev.event; } catch(e) {}

  const color = getTypeColor(ce.type || 'unknown');

  const hmacHTML = ev.channel === 'webhook'
    ? `<span class="hmac-badge ${ev.hmac_status}">${ev.hmac_status === 'valid' ? 'HMAC valid' : ev.hmac_status === 'invalid' ? 'HMAC invalid' : 'no sig'}</span>`
    : '';

  const posHTML = ev.channel === 'stream' && ev.queue_position !== undefined
    ? `<span class="queue-pos">pos #${ev.queue_position}</span>`
    : '';

  // Batch info for webhook events
  let batchHTML = '';
  if (ev.channel === 'webhook' && ev.batch_size > 0) {
    const batchColor = ev.batch_size > 1 ? 'var(--orange)' : 'var(--text-secondary)';
    batchHTML = `<span style="background:${batchColor}; color:#000; padding:1px 5px; border-radius:3px; font-size:10px; font-weight:600;">BATCH ${ev.batch_index}/${ev.batch_size}</span>`;
  }

  // HTTP delivery details for webhook events
  let deliveryHTML = '';
  if (ev.channel === 'webhook') {
    const parts = [];
    if (ev.content_type) parts.push(`Content-Type: ${ev.content_type}`);
    if (ev.signature) parts.push(`X-Webhook-Signature: ${ev.signature.substring(0, 30)}...`);
    if (ev.timestamp_header) parts.push(`X-Webhook-Timestamp: ${ev.timestamp_header}`);
    if (ev.batch_id) parts.push(`Batch-ID: ${ev.batch_id}`);
    if (parts.length > 0) {
      deliveryHTML = `<div class="event-delivery-info">${parts.map(p => `<div>${p}</div>`).join('')}</div>`;
    }
  }

  const card = document.createElement('div');
  card.className = 'event-card';
  card.onclick = (e) => {
    if (e.target.closest('.event-json, .event-delivery-info')) return; // don't toggle when clicking inside expanded content
    card.classList.toggle('expanded');
  };
  card.innerHTML = `
    <div class="event-card-header">
      <span class="channel-badge ${ev.channel}">${ev.channel}</span>
      <span class="event-type" style="color:${color}">${ce.type || 'unknown'}</span>
      ${batchHTML}
      ${hmacHTML}
      ${posHTML}
    </div>
    <div class="event-card-meta">
      <span>source: ${ce.source || '-'}</span>
      <span>subject: ${ce.subject || '-'}</span>
      <span>id: ${(ce.id || '-').substring(0, 12)}</span>
      <span>${relativeTime(ev.received_at)}</span>
    </div>
    ${deliveryHTML}
    <div class="event-json">${highlightJSON(ce)}</div>
  `;
  return card;
}

// -----------------------------------------------------------------------
// Render event lists (incremental — avoids full DOM rebuild / flicker)
// -----------------------------------------------------------------------
let webhookRenderedCount = 0;  // how many events currently in DOM
let streamRenderedCount = 0;
let lastWebhookFilter = '';
let lastStreamFilter = '';

function renderWebhookEvents(forceRebuild) {
  const filter = document.getElementById('webhook-filter').value.toLowerCase();
  if (filter !== lastWebhookFilter) { forceRebuild = true; lastWebhookFilter = filter; }

  const filtered = webhookEvents.filter(ev => {
    if (!filter) return true;
    let ce = {};
    try { ce = typeof ev.event === 'string' ? JSON.parse(ev.event) : ev.event; } catch(e) {}
    return (ce.type || '').toLowerCase().includes(filter);
  });

  if (filtered.length === 0) {
    if (webhookLog.querySelector('.empty-state') && !forceRebuild) return;
    webhookLog.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">&#9744;</div>
      <div>No webhook events received yet</div>
      <div style="font-size:11px">POST CloudEvents to the webhook URL above</div>
    </div>`;
    webhookRenderedCount = 0;
    return;
  }

  if (forceRebuild || webhookRenderedCount === 0) {
    webhookLog.innerHTML = '';
    filtered.forEach(ev => webhookLog.appendChild(renderEventCard(ev)));
    webhookRenderedCount = filtered.length;
  } else if (filtered.length > webhookRenderedCount) {
    // Prepend only the new events (they come newest-first from the API)
    const newCount = filtered.length - webhookRenderedCount;
    const firstChild = webhookLog.firstChild;
    for (let i = newCount - 1; i >= 0; i--) {
      const card = renderEventCard(filtered[i]);
      card.style.animation = 'slideIn 0.3s ease-out';
      webhookLog.insertBefore(card, firstChild);
    }
    webhookRenderedCount = filtered.length;
  }
  if (!webhookPaused) webhookLog.scrollTop = 0;
}

function renderStreamEvents(forceRebuild) {
  const filter = document.getElementById('stream-filter').value.toLowerCase();
  if (filter !== lastStreamFilter) { forceRebuild = true; lastStreamFilter = filter; }

  const filtered = streamEvents.filter(ev => {
    if (!filter) return true;
    let ce = {};
    try { ce = typeof ev.event === 'string' ? JSON.parse(ev.event) : ev.event; } catch(e) {}
    return (ce.type || '').toLowerCase().includes(filter);
  });

  if (filtered.length === 0) {
    if (streamLog.querySelector('.empty-state') && !forceRebuild) return;
    streamLog.innerHTML = `<div class="empty-state">
      <div class="empty-state-icon">&#9783;</div>
      <div>${streamConnected ? 'Waiting for stream events...' : 'Connect to a stream subscription'}</div>
      <div style="font-size:11px">Select a subscription and click Connect</div>
    </div>`;
    streamRenderedCount = 0;
    return;
  }

  if (forceRebuild || streamRenderedCount === 0) {
    streamLog.innerHTML = '';
    filtered.forEach(ev => streamLog.appendChild(renderEventCard(ev)));
    streamRenderedCount = filtered.length;
  } else if (filtered.length > streamRenderedCount) {
    const newCount = filtered.length - streamRenderedCount;
    const firstChild = streamLog.firstChild;
    for (let i = newCount - 1; i >= 0; i--) {
      const card = renderEventCard(filtered[i]);
      card.style.animation = 'slideIn 0.3s ease-out';
      streamLog.insertBefore(card, firstChild);
    }
    streamRenderedCount = filtered.length;
  }
  if (!streamPaused) streamLog.scrollTop = 0;
}

function clearAllEvents() {
  webhookEvents.length = 0;
  streamEvents.length = 0;
  webhookRenderedCount = 0;
  streamRenderedCount = 0;
  webhookLog.innerHTML = '';
  streamLog.innerHTML = '';
  fetch('/api/events', {method: 'DELETE'});
  renderWebhookEvents(true);
  renderStreamEvents(true);
}

// -----------------------------------------------------------------------
// Pause toggle
// -----------------------------------------------------------------------
function togglePause(channel) {
  if (channel === 'webhook') {
    webhookPaused = !webhookPaused;
    document.getElementById('webhook-pause-btn').textContent = webhookPaused ? 'Auto-scroll OFF' : 'Auto-scroll ON';
  } else {
    streamPaused = !streamPaused;
    document.getElementById('stream-pause-btn').textContent = streamPaused ? 'Auto-scroll OFF' : 'Auto-scroll ON';
  }
}

// -----------------------------------------------------------------------
// Copy webhook URL
// -----------------------------------------------------------------------
function copyWebhookURL() {
  const url = document.getElementById('webhook-url').textContent;
  navigator.clipboard.writeText(url).then(() => {
    const toast = document.getElementById('copy-toast');
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1500);
  });
}

// -----------------------------------------------------------------------
// Poll webhook events
// -----------------------------------------------------------------------
async function pollWebhookEvents() {
  try {
    const resp = await fetch('/api/events?channel=webhook&limit=200');
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data) return;
    webhookEvents = data;

    const dot = document.getElementById('webhook-dot');
    if (webhookEvents.length > lastWebhookCount) {
      dot.className = 'status-dot active';
      document.getElementById('webhook-status').textContent = `${webhookEvents.length} events`;
      document.getElementById('webhook-status').className = 'status-text connected';
      clearTimeout(dot._timeout);
      dot._timeout = setTimeout(() => {
        dot.className = 'status-dot waiting';
      }, 3000);
      lastWebhookCount = webhookEvents.length;
    }

    renderWebhookEvents();
  } catch(e) { /* ignore */ }
}

// -----------------------------------------------------------------------
// Poll stats
// -----------------------------------------------------------------------
async function pollStats() {
  try {
    const resp = await fetch('/api/stats');
    if (!resp.ok) return;
    const data = await resp.json();
    document.getElementById('stat-webhook').textContent = data.total_webhook_events || 0;
    document.getElementById('stat-stream').textContent = data.total_stream_events || 0;
    document.getElementById('stat-active').textContent = data.active_streams || 0;
  } catch(e) { /* ignore */ }
}

// -----------------------------------------------------------------------
// Clear all
// -----------------------------------------------------------------------
async function clearAll() {
  await fetch('/api/events', { method: 'DELETE' });
  webhookEvents = [];
  streamEvents = [];
  lastWebhookCount = 0;
  renderWebhookEvents();
  renderStreamEvents();
  pollStats();
}

// -----------------------------------------------------------------------
// Load subscriptions
// -----------------------------------------------------------------------
async function loadSubscriptions() {
  const select = document.getElementById('stream-sub-select');
  try {
    const resp = await fetch('/api/subscriptions');
    if (!resp.ok) {
      select.innerHTML = '<option value="">Failed to load subscriptions</option>';
      return;
    }
    const data = await resp.json();
    const subs = data.subscriptions || data || [];

    select.innerHTML = '<option value="">-- Select a subscription --</option>';
    subs.forEach(sub => {
      if (sub.delivery_mode !== 'stream') return;
      const types = (sub.event_types || []).join(', ');
      const opt = document.createElement('option');
      opt.value = sub.id;
      opt.textContent = `${sub.id.substring(0, 12)}... | ${types} | ${sub.delivery_mode}`;
      select.appendChild(opt);
    });

    // If no stream subs found, show all subs.
    if (select.options.length <= 1) {
      select.innerHTML = '<option value="">-- Select a subscription --</option>';
      subs.forEach(sub => {
        const types = (sub.event_types || []).join(', ');
        const opt = document.createElement('option');
        opt.value = sub.id;
        opt.textContent = `${sub.id.substring(0, 12)}... | ${types} | ${sub.delivery_mode || 'n/a'}`;
        select.appendChild(opt);
      });
    }
  } catch(e) {
    select.innerHTML = '<option value="">Error loading subscriptions</option>';
  }
}

// -----------------------------------------------------------------------
// Stream connection
// -----------------------------------------------------------------------
function setStreamStatus(status, text) {
  const dot = document.getElementById('stream-dot');
  const statusEl = document.getElementById('stream-status');
  const btn = document.getElementById('stream-connect-btn');

  dot.className = 'status-dot ' + status;
  statusEl.textContent = text;
  statusEl.className = 'status-text ' + status;

  if (status === 'active' || status === 'connecting') {
    btn.textContent = 'Disconnect';
    btn.className = 'btn btn-danger';
    streamConnected = true;
  } else {
    btn.textContent = 'Connect';
    btn.className = 'btn btn-green';
    streamConnected = false;
  }
}

async function toggleStreamConnection() {
  if (streamConnected) {
    // Disconnect.
    if (streamSubID) {
      await fetch(`/api/stream/disconnect?subscription_id=${encodeURIComponent(streamSubID)}`);
    }
    setStreamStatus('waiting', 'Disconnected');
    streamSubID = '';
    return;
  }

  const subID = document.getElementById('stream-sub-select').value;
  if (!subID) {
    alert('Please select a subscription first.');
    return;
  }

  streamSubID = subID;
  const resume = document.getElementById('stream-resume').value.trim();

  setStreamStatus('connecting', 'Connecting...');

  try {
    let url = `/api/stream/connect?subscription_id=${encodeURIComponent(subID)}`;
    if (resume) url += `&resume_after=${encodeURIComponent(resume)}`;

    const resp = await fetch(url);
    if (!resp.ok) {
      const err = await resp.json();
      setStreamStatus('error', 'Error: ' + (err.error || 'unknown'));
      return;
    }
    // Status will be updated via WebSocket notifications.
  } catch(e) {
    setStreamStatus('error', 'Connection failed');
  }
}

// -----------------------------------------------------------------------
// Browser WebSocket — receives forwarded stream events + status updates.
// -----------------------------------------------------------------------
function connectBrowserWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsURL = `${proto}//${location.host}/api/stream/ws`;

  browserWS = new WebSocket(wsURL);

  browserWS.onopen = () => {
    console.log('[ws] browser WebSocket connected');
  };

  browserWS.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);

      if (msg.type === 'stream_event' && msg.event) {
        streamEvents.unshift(msg.event);
        if (streamEvents.length > 500) streamEvents.length = 500;
        renderStreamEvents();
      }

      if (msg.type === 'stream_status') {
        const st = msg.status;
        if (st === 'connected') {
          setStreamStatus('active', 'Connected');
        } else if (st === 'disconnected') {
          setStreamStatus('waiting', 'Disconnected');
        } else if (st === 'error') {
          setStreamStatus('error', 'Error: ' + (msg.error || 'unknown'));
        }
      }
    } catch(err) { /* ignore */ }
  };

  browserWS.onclose = () => {
    console.log('[ws] browser WebSocket closed, reconnecting in 2s...');
    setTimeout(connectBrowserWS, 2000);
  };

  browserWS.onerror = () => {
    browserWS.close();
  };
}

// -----------------------------------------------------------------------
// Init
// -----------------------------------------------------------------------
renderWebhookEvents();
renderStreamEvents();
loadSubscriptions();
connectBrowserWS();

// Poll webhook events every 2s.
setInterval(pollWebhookEvents, 500);
pollWebhookEvents();

// Poll stats every 3s.
setInterval(pollStats, 3000);
pollStats();

// Update relative times every 10s.
setInterval(() => {
  renderWebhookEvents();
  renderStreamEvents();
}, 10000);
</script>
